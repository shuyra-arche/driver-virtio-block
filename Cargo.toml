hub-api = { git = "https://github.com/shuyra-arche/hub.git", rev = "cccef3f325198c8390007ae88b064bae0f21f93e" }
iommu-api = { git = "https://github.com/shuyra-arche/iommu.git", rev = "3d210b4da522ee0c7427265ce0a0d8946e124b21" }
driver-shared = { git = "https://github.com/shuyra-arche/driver.git", rev = "bb3427e179e87b640e0d51115a44544fae231252" }
driver-support = { git = "https://github.com/shuyra-arche/driver.git", rev = "8e6de5a77aa52184bb6f7fbbcbc961f779e94629" }
pci-api = { git = "https://github.com/shuyra-arche/driver-pci.git", rev = "b2c2e5d7a5fbd0b1572273dbbffb56bd91b15009" }

[profile.dev]
panic = "abort"
